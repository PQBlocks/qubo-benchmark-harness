{
  "benchmark": {
    "min_runs": 100,
    "max_runs": 10000,
    "confidence_level": 0.95,
    "bootstrap_iterations": 1000,
    "seed": 42,
    "success_threshold": 0.99,
    "boundary_half_width": 0.5,
    "regularization_epsilon": 1e-10,
    "threads_per_solver": null,
    "memory_limit_mb": 8192,
    "timeout_seconds": 3600
  },
  "loader": {
    "suite_paths": {
      "gset": "data/instances/gset",
      "biqmac": "data/instances/biqmac",
      "qplib": "data/instances/qplib",
      "tsplib": "data/instances/tsplib",
      "orlib": "data/instances/orlib",
      "planted": "data/instances/planted"
    },
    "verification_files": {
      "gset": "data/verification/gset_solutions.csv",
      "biqmac": "data/verification/biqmac_solutions.csv",
      "qplib": "data/verification/qplib_solutions.csv",
      "planted": null
    }
  },
  "metrics": {
    "target_energy_strategy": "exact",
    "epsilon_relative": 0.0001,
    "epsilon_absolute": 0.1
  },
  "output": {
    "output_dir": "results",
    "format": "json",
    "pretty_print": true
  }
}